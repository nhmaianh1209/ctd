<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYTP 2025 — Hồ sơ Young Talent</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16315E; --ink:#2A2E35; --mut:#8A929E;
  --ss:#5FD1C1;        /* SUPER STAR — teal */
  --ss-d:#2E9E8D;
  --rs:#1D50A3;        /* RISING STAR — PANTONE 2728C */
  --rs-d:#163F82;
  --green:#51AC70; --brick:#B86054;
  --line:#E8ECF2; --soft:#F6F8FB;
  --maxw:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lexend Deca',system-ui,sans-serif;background:#EBEEF4;color:var(--ink);
  font-size:14.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
.shell{max-width:var(--maxw);margin:0 auto}

header{background:linear-gradient(110deg,#16315E 0%,#24497F 100%);color:#fff}
header .shell{padding:24px 28px;display:flex;align-items:center;gap:26px}
header .logo{height:46px;width:auto;flex:0 0 auto;display:block}
header .ttl{border-left:1px solid rgba(255,255,255,.22);padding-left:26px}
header .eyebrow{font-size:11px;letter-spacing:2.6px;text-transform:uppercase;opacity:.62;margin-bottom:5px}
header h1{font-size:25px;font-weight:300;letter-spacing:.2px;line-height:1.25}
header h1 b{font-weight:600}
.cta{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;background:var(--ss);color:#0E3B35;
  text-decoration:none;font-size:14px;font-weight:600;padding:12px 20px;border-radius:9px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);transition:.15s}
.cta b{font-weight:800}
.cta:hover{background:#94EEDC;transform:translateY(-1px)}
.cta:after{content:"→";font-size:16px}
footer{margin-top:56px;padding:0 28px 40px;text-align:center;font-size:12px;line-height:1.7;color:var(--mut)}
footer .cf{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--navy)}
footer .cf span{font-weight:400;letter-spacing:.4px;text-transform:none;color:var(--mut)}
footer .cf span:before{content:" · "}

.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar .shell{padding:12px 28px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{font-family:inherit;font-size:13.5px;padding:9px 13px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);transition:.15s}
.bar input{min-width:230px}
.bar input:focus,.bar select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(22,49,94,.1)}
.bar .n{margin-left:auto;font-size:13px;color:var(--mut)}

.wrap{display:grid;grid-template-columns:240px 1fr;gap:20px;padding:20px 28px 60px;align-items:start}

/* LEFT */
.nav{background:#fff;border-radius:14px;overflow:hidden;position:sticky;top:83px;
  max-height:calc(100vh - 106px);display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(22,49,94,.07)}
.nav .hd{padding:15px 18px 11px;font-size:10.5px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--mut)}
.nav .body{overflow-y:auto;padding-bottom:8px}
.grp{padding:13px 18px 6px;font-size:10.5px;font-weight:600;letter-spacing:1.3px;
  display:flex;align-items:center;gap:8px}
.grp.ss{color:var(--ss-d)} .grp.rs{color:var(--rs-d)}
.grp:after{content:"";flex:1;height:1px;background:var(--line)}
.it{padding:9px 18px;cursor:pointer;display:flex;align-items:baseline;gap:9px;
  border-left:3px solid transparent;transition:.14s}
.it:hover{background:var(--soft)}
.it.on.ss{background:#EDFBF8;border-left-color:var(--ss)}
.it.on.rs{background:#EEF3FB;border-left-color:var(--rs)}
.it .cd{font-size:10.5px;color:var(--mut);font-weight:500;letter-spacing:.5px;flex:0 0 34px}
.it .nm{font-size:13.5px;line-height:1.35}
.it.on .nm{font-weight:500;color:var(--navy)}
.it.on.ss .cd{color:var(--ss-d)} .it.on.rs .cd{color:var(--rs-d)}

/* CARDS */
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(22,49,94,.07)}

.hero{display:flex;gap:26px;padding:28px 30px}
.hero.ss{border-top:4px solid var(--ss)} .hero.rs{border-top:4px solid var(--rs)}
.ph{width:132px;height:174px;border-radius:12px;object-fit:cover;flex:0 0 132px;
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;
  font-weight:300;letter-spacing:2px}
.ph.ss{background:linear-gradient(150deg,#5FD1C1,#2E9E8D)}
.ph.rs{background:linear-gradient(150deg,#3A6CC0,#1D50A3)}
.hero .info{flex:1;min-width:250px}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:1.6px;padding:5px 13px;
  border-radius:20px;margin-bottom:11px}
.tag.ss{background:var(--ss);color:#0E3B35}
.tag.rs{background:var(--rs);color:#fff}
.hero h2{font-size:27px;font-weight:500;color:var(--navy);line-height:1.15;letter-spacing:-.2px}
.hero .line{font-size:13.5px;color:var(--mut);margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.fld{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:7px;
  padding:5px 12px;font-size:14px;font-weight:600;letter-spacing:.2px}
.fld b{font-size:9.5px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;opacity:.7}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 22px;margin-top:20px}
.facts div b{display:block;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--mut);font-weight:600;margin-bottom:2px}
.facts div span{font-size:13.5px}
.hx{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.hx>b{display:block;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--mut);font-weight:600;margin-bottom:6px}
.hx ul.ex li:last-child{margin-bottom:0}
.vbtn{display:inline-flex;align-items:center;gap:7px;margin-top:17px;color:#fff;
  text-decoration:none;font-size:13px;padding:9px 17px;border-radius:8px;transition:.15s;background:var(--navy)}
.vbtn:hover{background:#24497F}
.vbtn.off{background:#E8ECF2;color:#A2AAB6;pointer-events:none}
.vrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin-top:17px}
.vrow .vbtn{margin-top:0}
.vnote{font-size:12px;color:var(--mut);font-style:italic}

/* section card head */
.chd{display:flex;align-items:center;gap:14px;padding:18px 30px;border-bottom:1px solid var(--line)}
.chd .num{width:32px;height:32px;border-radius:9px;color:#fff;font-size:14px;font-weight:500;
  display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.chd.ss .num{background:var(--ss-d)} .chd.rs .num{background:var(--rs-d)}
.chd h3{font-size:15.5px;font-weight:600;color:var(--navy);letter-spacing:.1px}
.chd .cap{font-size:12px;color:var(--mut);margin-top:1px}
.cbody{padding:24px 30px 28px}

.lbl{font-size:10.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--mut);margin-bottom:10px}
.lbl:not(:first-child){margin-top:26px}

/* NV */
.nvs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.nv{border:1px solid var(--line);border-radius:11px;padding:15px 18px}
.nv .t{font-size:10px;font-weight:600;letter-spacing:1.3px;margin-bottom:7px}
.nv.ss .t{color:var(--ss-d)} .nv.rs .t{color:var(--rs-d)}
.nv .p{font-size:16px;font-weight:500;color:var(--navy);line-height:1.3}
.nv .r{font-size:13px;color:var(--mut);margin-top:3px}
.nv.e{background:var(--soft);border-style:dashed}
.nv.e .t{color:#B9C0C9!important}
.nv.e .p{font-size:13.5px;font-weight:400;color:#AAB2BC}

/* share cards */
.res{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rc{border:1px solid var(--line);border-radius:11px;padding:16px 18px;background:#fff}
.rc .t{font-size:10.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:7px}
.rc.s{border-top:3px solid var(--green)}.rc.s .t{color:var(--green)}
.rc.w{border-top:3px solid var(--brick)}.rc.w .t{color:var(--brick)}
.rc.c{border-top:3px solid var(--navy)}.rc.c .t{color:var(--navy)}
.rc.k{border-top:3px solid var(--mut)}.rc.k .t{color:var(--mut)}
.rc p{font-size:13.5px}
.rc p+p{margin-top:8px}
.full{grid-column:1/-1}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 16px;font-size:13.5px;color:#4A515B}
.note{border-left:3px solid var(--brick);background:#FDF9F8;padding:14px 18px;
  border-radius:0 9px 9px 0;font-size:13.5px}
.mod{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mod .b{background:var(--soft);border-radius:11px;padding:15px 18px}
.mod .b .h{font-size:12px;font-weight:600;color:var(--navy);margin-bottom:8px}
.mod ol{margin-left:17px;font-size:13px;color:#4A515B}
.mod ol li{margin-bottom:3px}

/* scores */
.sc{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.row{display:flex;align-items:center;gap:13px;padding:6px 0;font-size:13.5px}
.row .nm2{flex:1}
.tr{width:96px;height:5px;background:#EDF0F5;border-radius:3px;overflow:hidden;flex:0 0 96px}
.fl{height:100%;border-radius:3px;background:var(--navy)}
.vl{width:40px;text-align:right;font-size:12.5px;color:var(--navy);font-weight:500;flex:0 0 40px}
.dts{display:flex;gap:4px}
.dt{width:9px;height:9px;border-radius:50%;background:#E6EAF0}
.dt.f.ss{background:var(--ss-d)} .dt.f.rs{background:var(--rs-d)}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pl{background:var(--soft);border-radius:9px;padding:9px 15px;font-size:13px}
.pl b{color:var(--navy);font-weight:500}
ul.ex{list-style:none;font-size:13.5px}
ul.ex li{padding-left:16px;position:relative;margin-bottom:5px}
ul.ex li:before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--mut)}
.empty{color:#AAB2BC;font-style:italic;font-size:13.5px}
@media(max-width:1000px){.wrap{grid-template-columns:1fr;padding:16px}
  .nav{position:static;max-height:320px}
  .res,.nvs,.sc,.mod{grid-template-columns:1fr}
  .hero{flex-wrap:wrap}header .shell,.bar .shell{padding-left:18px;padding-right:18px}}
@media(max-width:600px){header .shell{flex-direction:column;align-items:flex-start;gap:14px}
  header .logo{height:34px} header .ttl{border-left:0;padding-left:0} header h1{font-size:22px}
  .cta{margin-left:0}
  footer{padding-left:18px;padding-right:18px}
  footer .cf span{display:block} footer .cf span:before{content:none}}
</style>
</head>

 str:"Không ngại khó, có trách nhiệm với vấn đề mình làm; bền bỉ, chịu áp lực tốt, thẳng thắn, hòa đồng.",

 career:"Phát triển chuyên sâu theo hướng Kết cấu hoặc BIM, từng bước nâng cao trách nhiệm, hướng tới các vai trò BIM Manager hoặc Project Manager.",
 wish:"Các dự án quy mô lớn, yêu cầu kỹ thuật cao, được tiếp xúc thực tế từ thiết kế đến thi công, đặc biệt trong các công việc liên quan đến Kết cấu và BIM tại Coteccons.",

{id:"RS21",grp:"RISING STAR",name:"Lê Vũ Quang Phú",dob:2003,sex:"Nam",field:"Xây dựng",
 school:"ĐH Quốc Tế - ĐHQG TP.HCM",fac:"Kỹ thuật và Quản lý Xây dựng",major:"Quản lý Xây dựng",

 r32:{"Định hướng nghề":3,"Động lực":3,"Sự phù hợp với nghề":4,"Cam kết chương trình":4},
 peer:"Phú làm việc ổn, vui vẻ, tham gia các hoạt động của team đầy đủ và nhiệt huyết. Tuy nhiên đôi lúc có vắng họp, bài làm đôi lúc cần phải nhờ team hỗ trợ giúp, cần tìm hiểu kỹ hơn.",
 str:"Có trách nhiệm, cẩn trọng với số liệu, thích ứng tốt với môi trường áp lực; biết lắng nghe và phối hợp tốt với đội nhóm.",

 career:"Phát triển theo hướng QS, đồng thời mở rộng trải nghiệm qua các vị trí khác trong 3-5 năm đầu để tích lũy kinh nghiệm và kiến thức, hướng tới thăng tiến trong công việc.",
 wish:"Ko có trình bày",
 commit:"Trách nhiệm, trình độ, thái độ, không ngừng phát triển năng lực, cống hiến hết mình và gắn bó lâu dài cùng Coteccons."}

let cur=C[0].id;
const el=i=>document.getElementById(i);
const es=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini=n=>n.split(" ").slice(-2).map(w=>w[0]).join("").toUpperCase();
const G=i=>C.find(x=>x.id===i);
const K=c=>c.grp==="SUPER STAR"?"ss":"rs";

function draw(){
  const q=el("q").value.toLowerCase().trim(),fg=el("fg").value,ff=el("ff").value;
  const rows=C.filter(c=>(!q||c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q))
    &&(!fg||c.grp===fg)&&(!ff||c.field===ff));
  let h="",last="";
  rows.forEach(c=>{
    const k=K(c);
    if(c.grp!==last){h+=`<div class="grp ${k}">${c.grp}</div>`;last=c.grp}
    h+=`<div class="it ${k} ${c.id===cur?"on":""}" onclick="pick('${c.id}')">
      <span class="cd">${c.id}</span><span class="nm">${es(c.name)}</span></div>`;
  });
  el("list").innerHTML=h||`<div style="padding:22px;text-align:center;color:#AAB2BC">Không có kết quả</div>`;
  el("cnt").textContent=rows.length;
  view();
}
function pick(i){cur=i;draw();window.scrollTo({top:0,behavior:"smooth"})}

function barRow(lb,v){
  if(v==null)return `<div class="row"><span class="nm2">${lb}</span><div class="tr"></div><span class="vl" style="color:#C3C9D2">—</span></div>`;
  return `<div class="row"><span class="nm2">${lb}</span>
    <div class="tr"><div class="fl" style="width:${v}%"></div></div><span class="vl">${v}</span></div>`;
}
function dotRow(lb,v,k){
  let d="";for(let i=1;i<=4;i++)d+=`<span class="dt ${i<=v?"f "+k:""}"></span>`;
  return `<div class="row"><span class="nm2">${lb}</span><span class="dts">${d}</span></div>`;
}
function nvc(t,nv,k){
  return nv?`<div class="nv ${k}"><div class="t">${t}</div><div class="p">${es(nv.p)}</div><div class="r">${es(nv.r)}</div></div>`
   :`<div class="nv ${k} e"><div class="t">${t}</div><div class="p">Chưa đăng ký nguyện vọng</div></div>`;
}
/* Định hướng nghề nghiệp = career + mong muốn làm việc (nếu có) */
function career(c){
  const ps=[c.career,c.wish].filter(t=>t&&!/^không trình bày/i.test(t.trim()));
  return ps.length?`<div class="rc c full"><div class="t">Định hướng nghề nghiệp</div>${ps.map(t=>`<p>${es(t)}</p>`).join("")}</div>`:"";
}
function rc(cls,title,body){return body?`<div class="rc ${cls}"><div class="t">${title}</div><p>${es(body)}</p></div>`:""}
function head(k,num,title,cap){
  return `<div class="chd ${k}"><span class="num">${num}</span>
    <div><h3>${title}</h3>${cap?`<div class="cap">${cap}</div>`:""}</div></div>`;
}

function view(){
  const c=G(cur),k=K(c);
  let h=`<div class="card"><div class="hero ${k}">
    <img class="ph ${k}" src="photos/${c.id.toLowerCase()}.png" alt=""
      onerror="this.outerHTML='<div class=\\'ph ${k}\\'>${ini(c.name)}</div>'">
    <div class="info">
      <span class="tag ${k}">${c.grp} · ${c.id}</span>
      <h2>${es(c.name)}</h2>
      <div class="line"><span class="fld"><b>Mảng</b>${es(c.field)}</span><span>${c.dob} · ${c.sex}</span></div>
      <div class="facts">
        <div><b>Trường</b><span>${es(c.school)}</span></div>
        <div><b>Khoa</b><span>${es(c.fac)}</span></div>
        <div><b>Ngành học</b><span>${es(c.major)}</span></div>
        <div><b>Thời gian onboard</b><span>${c.onboard}</span></div>
      </div>
      ${c.exp&&c.exp.length?`<div class="hx"><b>Kinh nghiệm làm việc</b>
        <ul class="ex">${c.exp.map(e=>`<li>${es(e)}</li>`).join("")}</ul></div>`:""}
      ${c.grp==="SUPER STAR"?(c.video
        ?`<div class="vrow"><a class="vbtn" href="${c.video}" target="_blank" rel="noopener">▶ Xem video giới thiệu</a>
            <span class="vnote">Xem tốt nhất trên máy tính, trình duyệt Microsoft Edge</span></div>`
        :`<div class="vrow"><span class="vbtn off">▶ Video giới thiệu — chưa có link</span></div>`):""}
    </div></div></div>`;

  /* (1) NGUYỆN VỌNG + CHIA SẺ CỦA YOUNG TALENT */
  h+=`<div class="card">${head(k,"1","Nguyện vọng","Nguyện vọng dự án &amp; chia sẻ của chính ứng viên")}
    <div class="cbody">
      <div class="lbl">Nguyện vọng dự án</div>
      <div class="nvs">${nvc("NGUYỆN VỌNG 1",c.nv1,k)}${nvc("NGUYỆN VỌNG 2",c.nv2,k)}</div>`;
  if(c.none){
    h+=`<div class="lbl">Chia sẻ của Young Talent</div>
      <p class="empty">Chưa có nội dung slide của ứng viên này trong file Candidate Profile.pptx.</p>
      </div></div>`;
    el("card").innerHTML=h;return;
  }
  h+=`<div class="lbl">Chia sẻ của Young Talent</div>
      <div class="res">
        ${rc("s","Điểm mạnh",c.str)}
        ${rc("w","Điểm cần cải thiện",c.weak)}
        ${career(c)}
        ${c.commit?`<div class="rc c full"><div class="t">Cam kết</div><p>${es(c.commit)}</p></div>`:""}
      </div>
    </div></div>`;

  /* (2) THÔNG TIN ĐÀO TẠO */
  h+=`<div class="card">${head(k,"2","Thông tin Đào tạo","Đánh giá từ nhóm &amp; nội dung chương trình")}
    <div class="cbody">
      <div class="lbl">Peer assessment</div>
      ${c.peer?`<div class="quote">${es(c.peer)}</div>`:`<p class="empty">Không có thông tin.</p>`}
      <div class="lbl">Nội dung được đào tạo</div>
      <div class="mod">
        <div class="b"><div class="h">Chuyên đề 1</div><ol>${DAOTAO.cd1.map(x=>`<li>${x}</li>`).join("")}</ol></div>
        <div class="b"><div class="h">Chuyên đề 2</div><ol>${DAOTAO.cd2.map(x=>`<li>${x}</li>`).join("")}</ol></div>
      </div>
    </div></div>`;

  /* (3) THÔNG TIN TUYỂN DỤNG */
  h+=`<div class="card">${head(k,"3","Thông tin Tuyển dụng","Nhận định Hội đồng &amp; kết quả đánh giá")}
    <div class="cbody">
      ${c.bgk?`<div class="lbl">Ghi chú V3.2 từ BGK</div><div class="note">${es(c.bgk)}</div>`:""}
      <div class="lbl">Kết quả đánh giá</div>
      <div class="pills"><span class="pl">Thành tích học tập <b>${es(c.gpa)||"—"}</b></span>
        <span class="pl">Tiếng Anh <b>${es(c.eng)||"—"}</b></span></div>
      <div class="sc" style="margin-top:16px"><div>
        ${barRow("V2. Cognitive Overall",c.cog)}${barRow("V2. Verbal Reasoning",c.v)}
        ${barRow("V2. Logical reasoning",c.l)}${barRow("V2. Numerical reasoning",c.n)}
      </div><div>
        ${Object.entries(c.r31).map(([a,b])=>dotRow("V3.1 "+a,b,k)).join("")}
        ${Object.entries(c.r32).map(([a,b])=>dotRow("V3.2 "+a,b,k)).join("")}
      </div></div>
      ${c.partial?`<p class="empty" style="margin-top:16px">Một số mục chưa trích xuất đầy đủ từ file Candidate Profile.pptx.</p>`:""}
    </div></div>`;
  el("card").innerHTML=h;
}
draw();
</script>
</body>
